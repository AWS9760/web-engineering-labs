<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopKit — keyboards, mice and headphones for students and developers." />

    <!-- Apply the saved (or system) theme before the page paints, so there is no light/dark flash -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("shopkit-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-bs-theme", theme);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Silkscreen&family=Unbounded:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>ShopKit ✦ Gear for builders</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
