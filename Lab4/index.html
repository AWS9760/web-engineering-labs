<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grey Box Homepage Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <div class="logo">LOGO</div>

        <nav class="nav">
            <div class="nav-item"></div>
            <div class="nav-item"></div>
            <div class="nav-item"></div>
            <div class="nav-item"></div>
            <div class="nav-item"></div>
        </nav>

        <div class="header-actions">
            <div class="small-box"></div>
            <div class="button-box"></div>
        </div>
    </header>

    <main class="page">

        <!-- HERO -->
        <section class="hero">
            <div class="hero-content">
                <div class="hero-title"></div>
                <div class="hero-text"></div>
                <div class="hero-buttons">
                    <div class="hero-button"></div>
                    <div class="hero-button"></div>
                </div>
            </div>

            <div class="hero-image"></div>
        </section>

        <!-- FEATURE STRIP -->
        <section class="feature-strip">
            <div class="feature-box"></div>
            <div class="feature-box"></div>
            <div class="feature-box"></div>
            <div class="feature-box"></div>
        </section>

        <!-- CONTENT SECTION -->
        <section class="content-section">
            <div class="section-heading"></div>

            <div class="cards">
                <article class="card">
                    <div class="card-image"></div>
                    <div class="card-title"></div>
                    <div class="card-text"></div>
                    <div class="card-button"></div>
                </article>

                <article class="card">
                    <div class="card-image"></div>
                    <div class="card-title"></div>
                    <div class="card-text"></div>
                    <div class="card-button"></div>
                </article>

                <article class="card">
                    <div class="card-image"></div>
                    <div class="card-title"></div>
                    <div class="card-text"></div>
                    <div class="card-button"></div>
                </article>
            </div>
        </section>

        <!-- LARGE FEATURE -->
        <section class="large-feature">
            <div class="large-feature-text">
                <div class="section-heading"></div>
                <div class="large-text"></div>
                <div class="hero-button"></div>
            </div>

            <div class="large-feature-image"></div>
        </section>

        <!-- CTA -->
        <section class="cta">
            <div class="cta-title"></div>
            <div class="cta-text"></div>
            <div class="hero-button"></div>
        </section>

    </main>

    <footer class="footer">
        <div class="footer-logo"></div>

        <div class="footer-columns">
            <div class="footer-column">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>

            <div class="footer-column">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>

            <div class="footer-column">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>

            <div class="footer-column">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </footer>

</body>
</html>
