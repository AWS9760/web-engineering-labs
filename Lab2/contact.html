<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact the Computer Science student.">
    <title>Contact Me</title>
</head>
<body>

    <!-- header -->
    <header>
        <h1>Computer Science Student</h1>
        <nav>
            <ul>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact">
            <h2>Contact Me</h2>
            <form action="#" method="POST">
                <div>
                    <label for="nameInput">Name:</label>
                    <input type="text" id="nameInput" name="name" required>
                </div>
                <div>
                    <label for="emailInput">Email:</label>
                    <input type="email" id="emailInput" name="email" required>
                </div>
                <div>
                    <label for="phoneInput">Phone:</label>
                    <input type="tel" id="phoneInput" name="phone">
                </div>
                <div>
                    <label for="topicSelect">Subject:</label>
                    <select id="topicSelect" name="topic" required>
                        <option value="">Choose an option...</option>
                        <option value="freelance">Project Work</option>
                        <option value="university">University/Exchange</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <label for="msgArea">Message:</label>
                    <textarea id="msgArea" name="message" rows="4" required></textarea>
                </div>
                <div>
                    <input type="checkbox" id="newsletterCheck" name="newsletter">
                    <label for="newsletterCheck">Subscribe to my dev blog</label>
                </div>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CS Student</p>
        <a href="mailto:student@example.com">Email Me</a> | 
        <a href="https://github.com/AWS9760/web-engineering-labs" target="_blank" rel="noopener noreferrer">GitHub</a> | 
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </footer>

</body>
</html>
